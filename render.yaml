# Render Blueprint for Synthetic User Lab.
# This file is deployment-ready, not evidence of a completed deployment.
# Adjust plan names to your current Render account offering and verify that
# pgcrypto is available in the provisioned PostgreSQL instance.

databases:
  - name: synthetic-user-lab-db
    databaseName: synthetic_user_lab
    user: sul
    region: frankfurt

services:
  - type: web
    name: synthetic-user-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synthetic-user-lab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_MAX_BATCH_SIZE
        value: "100"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "60000"
